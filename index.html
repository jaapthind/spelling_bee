<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Spelling Bee Assessment</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23ff3b30%22/><text y=%2270%22 x=%2215%22 font-size=%2265%22>🐝</text></svg>">
<style>
    /* ==========================================================================
       CORE SYSTEM & RESET
       ========================================================================== */
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    @keyframes liquidBg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    body, html {
        width: 100%; 
        height: 100%; 
        background: linear-gradient(-45deg, #e6ebf2, #ffffff, #d5dde6, #ffffff);
        background-size: 400% 400%;
        animation: liquidBg 25s ease infinite;
        color: #000000;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        user-select: none;
        overflow: hidden; /* Prevents all scrollbars */
    }
    /* Add this inside the <style> block, under the body, html rules */
    #app-container { max-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }

    /* ==========================================================================
       EXTREMELY THICK LIQUID GLASS
       ========================================================================== */
    .liquid-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.15));
        backdrop-filter: blur(40px) saturate(120%);
        -webkit-backdrop-filter: blur(40px) saturate(120%);
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-bottom-color: rgba(255, 255, 255, 0.3);
        border-right-color: rgba(255, 255, 255, 0.3);
        box-shadow: 
            0 30px 60px rgba(0, 0, 0, 0.12),
            inset 0 2px 15px rgba(255, 255, 255, 1),
            inset 0 -2px 15px rgba(0, 0, 0, 0.05);
        border-radius: 32px;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
        position: relative;
    }

    .liquid-glass::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 30px;
        background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%);
        pointer-events: none;
    }

    /* ==========================================================================
       BOOT SEQUENCE
       ========================================================================== */
    #boot-sequence {
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%;
        background: #ffffff; 
        z-index: 10000; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        transition: opacity 1s ease;
    }
    .main-panel.success-pulse {
    border-color: rgba(0, 0, 0, 0.8);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2), inset 0 2px 25px rgba(255, 255, 255, 1);
    transform: scale(1.01) translateY(-2px);
    }
    .main-panel.error-pulse {
        border-color: rgba(180, 0, 0, 0.6);
        box-shadow: 0 20px 40px rgba(180, 0, 0, 0.15), inset 0 2px 15px rgba(255, 255, 255, 1);
    }

    #init-btn {
        padding: 18px 40px; 
        font-size: 16px; 
        font-weight: 800;
        cursor: pointer; 
        text-transform: uppercase;
        letter-spacing: 3px; 
        color: #000000;
        z-index: 10;
        margin-bottom: 40px;
    }

    #init-btn:hover { 
        transform: translateY(-5px);
        box-shadow: 
            0 35px 65px rgba(0, 0, 0, 0.15),
            inset 0 2px 15px rgba(255, 255, 255, 1);
    }

    #terminal-wrapper {
        width: 600px; 
        height: 150px;
        overflow: hidden;
    }

    #terminal-logs {
        color: #333333; 
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px; 
        line-height: 1.6;
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        height: 100%;
    }

    /* ==========================================================================
       MAIN APPLICATION LAYOUT
       ========================================================================== */
    #app-container {
        display: none; 
        flex-direction: column;
        height: 100vh; 
        width: 100vw; 
        padding: 2vh 2vw;
        gap: 2vh;
    }

    header {
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        padding: 20px 40px; 
        border-radius: 24px;
    }

    .header-controls {
        display: flex;
        gap: 20px;
    }

    .std-btn {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
        border: 1px solid rgba(255,255,255,0.9);
        border-bottom-color: rgba(0,0,0,0.1);
        color: #000; 
        padding: 14px 28px; 
        font-size: 13px; 
        font-weight: 800;
        cursor: pointer; 
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        border-radius: 16px;
        backdrop-filter: blur(20px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.8);
    }

    .std-btn:hover { 
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 2px 5px rgba(255,255,255,1);
    }

    .std-btn:active {
        transform: translateY(1px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    main { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        padding: 20px;
    }

    .main-panel {
        width: 100%;
        max-width: 950px;
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .dashboard {
        display: flex;
        gap: 80px;
        margin-bottom: 60px;
        text-align: center;
        position: relative;
        z-index: 2;
    }

    .stat-group {
        display: flex;
        flex-direction: column;
    }

    .stat-val {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #111;
        text-shadow: 0 4px 10px rgba(255,255,255,0.8);
    }

    .stat-lbl {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: #555;
        margin-top: 10px;
        font-weight: 700;
    }

    .input-zone { 
        position: relative; 
        width: 100%; 
        max-width: 750px;
        margin-bottom: 30px; 
        z-index: 2;
    }
    
    #console-input {
        width: 100%; 
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid rgba(255,255,255,1);
        border-bottom-color: rgba(0,0,0,0.1);
        border-radius: 20px;
        color: #000000; 
        font-size: 64px; 
        padding: 30px 20px; 
        text-align: center; 
        outline: none;
        font-family: 'Helvetica Neue', sans-serif; 
        letter-spacing: 14px; 
        font-weight: 300;
        text-transform: uppercase; 
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.02), 0 15px 35px rgba(0,0,0,0.05);
        backdrop-filter: blur(10px);
    }

    #console-input:focus { 
        background: rgba(255, 255, 255, 0.9);
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.01), 0 25px 50px rgba(0,0,0,0.1);
        transform: scale(1.03);
    }
    
    #console-input:disabled { 
        opacity: 0.5; 
        cursor: not-allowed; 
    }

    #visual-feedback { 
        height: 35px; 
        font-size: 20px; 
        letter-spacing: 4px; 
        font-weight: 900; 
        text-align: center; 
        opacity: 0; 
        transition: opacity 0.3s, transform 0.3s; 
        text-transform: uppercase;
        transform: translateY(15px);
        z-index: 2;
    }

    .msg-success { color: #000000; text-shadow: 0 0 15px rgba(255,255,255,1); }
    .msg-error { color: #777777; text-decoration: line-through; }

    #context-panel {
        margin-top: 40px; 
        font-size: 15px; 
        color: #444444;
        text-align: center;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 800;
        z-index: 2;
        background: rgba(255,255,255,0.4);
        padding: 15px 30px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.6);
    }

    footer { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 20px 50px; 
        border-radius: 24px;
    }

    .footer-section {
        display: flex;
        gap: 50px;
        z-index: 2;
    }
</style>
</head>
<body>

<div id="boot-sequence">
    <button id="init-btn" class="liquid-glass">INITIALIZE SYSTEM</button>
    <div id="terminal-wrapper">
        <div id="terminal-logs"></div>
    </div>
</div>

<div id="app-container">
    <header class="liquid-glass">
        <div class="header-controls">
            <button class="std-btn" id="btn-voice">VOICE: 1/10</button>
        </div>
        <div class="header-controls">
            <button class="std-btn" id="btn-play">RE-BROADCAST</button>
            <button class="std-btn" id="btn-skip">OVERRIDE</button>
        </div>
    </header>

    <main>
        <div class="main-panel liquid-glass">
            <div class="dashboard">
                <div class="stat-group">
                    <span class="stat-val" id="level-display">PHASE 01</span>
                    <span class="stat-lbl" id="level-desc">INITIALIZING...</span>
                </div>
                <div class="stat-group">
                    <span class="stat-val" id="ui-score">00000</span>
                    <span class="stat-lbl">TOTAL SCORE</span>
                </div>
                <div class="stat-group">
                    <span class="stat-val" id="ui-mult">1.00x</span>
                    <span class="stat-lbl">MULTIPLIER</span>
                </div>
            </div>

            <div class="input-zone">
                <input type="text" id="console-input" autocomplete="off" spellcheck="false" placeholder="AWAITING AUDIO..." disabled>
            </div>
            
            <div id="visual-feedback"></div>
            
            <div id="context-panel">
                <div id="context-def">CONNECTING TO SECURE LEXICON...</div>
            </div>
        </div>
    </main>

    <footer class="liquid-glass">
        <div class="footer-section">
            <div class="stat-group">
                <span class="stat-val" style="font-size: 26px;" id="ui-wpm">0.0</span>
                <span class="stat-lbl">WPM</span>
            </div>
            <div class="stat-group">
                <span class="stat-val" style="font-size: 26px;" id="ui-acc">100%</span>
                <span class="stat-lbl">PRECISION</span>
            </div>
        </div>
        <div class="footer-section">
            <div class="stat-group" style="align-items: center;">
                <span class="stat-val" style="font-size: 32px;" id="ui-rem">10</span>
                <span class="stat-lbl">TOTAL WORDS REMAINING</span>
            </div>
        </div>
        <div class="footer-section">
            <div class="stat-group" style="align-items: flex-end;">
                <span class="stat-val" style="font-size: 26px;" id="lvl-progress-text">0/2</span>
                <span class="stat-lbl">LEVEL PROGRESS</span>
            </div>
        </div>
    </footer>
</div>

/**
 * ==========================================================================
 * AUDIO ENGINE - HIGH CLARITY
 * ==========================================================================
 */
class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.synth = window.speechSynthesis;
        this.availableVoices = [];
        this.currentVoiceIndex = 0;
        
        this.btnVoice = document.getElementById('btn-voice');
        this.initVoices();
    }
    
    initVoices() {
        const populate = () => {
            let allVoices = this.synth.getVoices();
            let engVoices = allVoices.filter(v => v.lang.startsWith('en'));
            if(engVoices.length === 0) engVoices = allVoices; 
            
            // Prioritize higher quality, clear voices (Google, Natural, Premium)
            engVoices.sort((a, b) => {
                let aQuality = (a.name.includes('Google') || a.name.includes('Natural') || a.name.includes('Premium')) ? -1 : 1;
                let bQuality = (b.name.includes('Google') || b.name.includes('Natural') || b.name.includes('Premium')) ? -1 : 1;
                return aQuality - bQuality;
            });

// Replace line 324 (this.availableVoices = engVoices.slice(0, 10);) with this line to allow up to 25 voices:
            this.availableVoices = engVoices.slice(0, 25);
            if(this.availableVoices.length > 0) {
                this.updateVoiceLabel();
            }
        };
        populate();
        this.synth.onvoiceschanged = populate;
        
        this.btnVoice.addEventListener('click', () => {
            if(this.availableVoices.length === 0) return;
            this.currentVoiceIndex = (this.currentVoiceIndex + 1) % this.availableVoices.length;
            this.updateVoiceLabel();
            this.createOsc(800, 'sine', 0.1, 0.05);
        });
    }
    
    updateVoiceLabel() {
        let v = this.availableVoices[this.currentVoiceIndex];
        let shortName = v.name.split(' ')[0] || "VOICE";
        this.btnVoice.textContent = `VOICE: ${shortName.toUpperCase()} (${this.currentVoiceIndex + 1}/${this.availableVoices.length})`;
    }
    
    speakWord(text) {
        if(this.synth.speaking) this.synth.cancel();
        let cleanText = text.replace(/[^a-zA-Z]/g, '');
        let utter = new SpeechSynthesisUtterance(cleanText);
        if(this.availableVoices.length > 0) {
            utter.voice = this.availableVoices[this.currentVoiceIndex];
        }
        
        // Locked strictly for maximum clarity and enunciation
        utter.rate = 0.75; 
        utter.pitch = 1.0;
        
        this.synth.speak(utter);
    }
    
    createOsc(freq, type, time, vol, sweepFreq = null) {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(sweepFreq) osc.frequency.exponentialRampToValueAtTime(sweepFreq, this.ctx.currentTime + time);
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);
        
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + time);
    }
    
    playKeyStroke() { this.createOsc(600 + Math.random()*200, 'sine', 0.05, 0.02); }
    
    playSuccess() {
        this.createOsc(500, 'sine', 0.2, 0.05);
        setTimeout(() => this.createOsc(750, 'triangle', 0.3, 0.05), 100);
    }
    
    playError() {
        this.createOsc(200, 'sawtooth', 0.3, 0.1, 100);
        setTimeout(() => this.createOsc(150, 'square', 0.4, 0.1, 50), 100);
    }
    
    playLevelUp() {
        this.createOsc(440, 'triangle', 0.5, 0.05, 880);
    }
}

/**
 * ==========================================================================
 * CONFETTI SYSTEM
 * ==========================================================================
 */
function createConfetti() {
    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '9999';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const colors = ['#000000', '#555555', '#999999', '#cccccc', '#d4af37', '#c0c0c0'];
    
    for(let i = 0; i < 200; i++) {
        particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2 + 100,
            vx: (Math.random() - 0.5) * 25,
            vy: (Math.random() - 0.5) * 25 - 15,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.4
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4; // gravity
            p.rot += p.rotSpeed;
            if(p.y < canvas.height) active = true;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        });
        if(active) {
            requestAnimationFrame(animate);
        } else {
            canvas.remove();
        }
    }
    animate();
}

            this.uiInput.focus();
        });
                window.addEventListener('keydown', (e) => {
            if (e.key === 'Control') {
                this.uiCtxDef.textContent = `HINT: Word contains ${this.currentWord.length} letters. Starts with "${this.currentWord[0].toUpperCase()}"`;
            }
        });
    }
    
    loadLevel(l) {
        this.level = l;
        this.wordIndex = 0;
        this.list = Lexicon[`lvl${l}`];
        
        this.uiLvl.textContent = `PHASE 0${l}`;
        const descArr = [
            "STANDARD LEXICON",
            "INTERMEDIATE LEXICON",
            "ADVANCED LEXICON",
            "EXPERT LEXICON",
            "MASTER LEXICON"
        ];
        this.uiDesc.textContent = descArr[l-1];
        
        if (l > 1) {
            this.audio.playLevelUp();
        }
        
        this.nextWord();
    }
    
    nextWord() {
        if(this.wordIndex >= this.list.length) {
            if(this.level < 5) {
                this.loadLevel(this.level + 1);
            } else {
                this.triggerVictory();
            }
            return;
        }
        
        this.wordGuesses = 0;
        this.currentWord = this.list[this.wordIndex];
        this.uiInput.value = '';
        this.uiInput.disabled = false;
        this.uiInput.focus();
        
        this.uiCtxDef.textContent = `AWAITING AUDIO TRANSCRIPTION...`;
        this.updateDiagnosticsUI();
        
        setTimeout(() => this.audio.speakWord(this.currentWord), 600);
    }
    
    validateInput() {
        let inputVal = this.uiInput.value.trim().toLowerCase();
        if(inputVal === "") return;
        
        if(inputVal === this.currentWord.toLowerCase()) {
            this.handleSuccess();
        } else {
            this.handleError();
        }
    }
    
    handleSuccess() {
        this.audio.playSuccess();
        this.combo++;
        this.wordsTyped++;
        this.globalWordCount++;
        this.multiplier = 1.0 + (Math.min(this.combo, 10) * 0.1);
        
        let basePoints = this.currentWord.length * 20;
        this.score += Math.floor(basePoints * this.multiplier * this.level);
        
        this.triggerVisualFeedback("CORRECT", true);
        this.wordIndex++;
        const el = document.querySelector('.main-panel');
        el.classList.add('success-pulse');
        setTimeout(() => el.classList.remove('success-pulse'), 400);
        this.updateStatsUI();
        this.nextWord();
    }
    
    handleError() {
        if (++this.wordGuesses >= 3) { 
            this.wordGuesses = 0; 
            if (++this.strikes >= 3) return this.triggerGameOver(); 
            this.triggerVisualFeedback("STRIKE " + this.strikes, false); 
            this.wordIndex++; 
            this.nextWord(); 
            return; 
        }
        
        this.audio.playError();
        this.combo = 0;
        this.multiplier = 1.0;
        this.triggerVisualFeedback("INCORRECT", false);
        this.uiInput.value = '';
        
        this.uiInput.style.transform = 'translateX(-10px)';
        setTimeout(() => this.uiInput.style.transform = 'translateX(10px)', 100);
        setTimeout(() => this.uiInput.style.transform = 'translateX(-10px)', 200);
        setTimeout(() => this.uiInput.style.transform = 'scale(1.03)', 300);
        const el = document.querySelector('.main-panel');
        el.classList.add('error-pulse');
        setTimeout(() => el.classList.remove('error-pulse'), 400);
        this.updateStatsUI();
    }
    
    triggerVisualFeedback(msg, isSuccess) {
        this.uiFeedback.textContent = msg;
        this.uiFeedback.className = isSuccess ? "msg-success" : "msg-error";
        
        this.uiFeedback.style.transform = 'translateY(15px)';
        this.uiFeedback.style.opacity = '0';
        void this.uiFeedback.offsetWidth;
        
        this.uiFeedback.style.transform = 'translateY(0)';
        this.uiFeedback.style.opacity = '1';
        
        setTimeout(() => {
            this.uiFeedback.style.opacity = '0';
            this.uiFeedback.style.transform = 'translateY(-15px)';
        }, 1200);
    }
    
    updateStatsUI() {
        this.uiScore.textContent = this.score.toString().padStart(5, '0');
        this.uiMult.textContent = this.multiplier.toFixed(2) + 'x';
    }
    
    updateDiagnosticsUI() {
        this.uiRem.textContent = 10 - this.globalWordCount;
        this.progressText.textContent = `${this.wordIndex}/${this.list.length}`;
    }
    
    updateDiagnostics() {
        if(this.startTime === 0) return;
        let minutes = (Date.now() - this.startTime) / 60000;
        if(minutes > 0) {
            let wpm = this.wordsTyped / minutes;
            this.uiWPM.textContent = wpm.toFixed(1);
        }
        if(this.wordsTyped > 0 || this.globalWordCount > 0) {
            let attempts = this.wordsTyped + (this.combo === 0 && this.wordsTyped > 0 ? 1 : 0);
            let acc = (this.wordsTyped / Math.max(attempts, 1)) * 100;
            this.uiAcc.textContent = Math.min(acc, 100).toFixed(1) + '%';
        }
    }
    
    triggerVictory() {
        this.uiInput.disabled = true;
        this.uiInput.value = "COMPLETE";
        this.uiCtxDef.textContent = "ALL 10 SECTORS COMPLETED SUCCESSFULLY.";
        this.audio.speakWord("Assessment complete. Excellent work.");
        this.progressText.textContent = `2/2`;
        this.uiRem.textContent = `0`;
        
        createConfetti();
        setInterval(createConfetti, 1500);
    }

    triggerGameOver() {
        this.uiInput.disabled = true;
        this.uiInput.value = "TERMINATED";
        this.uiCtxDef.textContent = "TOO MANY CORRUPTIONS. SYSTEM LOCKED.";
        this.audio.speakWord("Game over. Three strikes recorded.");
    }
}

/**
 * ==========================================================================
 * BOOT SEQUENCE
 * ==========================================================================
 */
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('init-btn');
    const bootContainer = document.getElementById('boot-sequence');
    const appContainer = document.getElementById('app-container');
    const logs = document.getElementById('terminal-logs');
    
    const bootSequenceLines = [
        "Initializing core services...",
        "Loading lexicon subsets...",
        "Secured 10 randomized terms.",
        "Establishing audio protocols...",
        "Ready."
    ];
    
    btn.addEventListener('click', () => {
        btn.style.display = 'none';
        
        let delay = 0;
        bootSequenceLines.forEach((line, index) => {
            setTimeout(() => {
                let p = document.createElement('div');
                p.textContent = `> ${line}`;
                logs.appendChild(p);
                
                if (index === bootSequenceLines.length - 1) {
                    setTimeout(() => {
                        bootContainer.style.opacity = '0';
                        setTimeout(() => {
                            bootContainer.style.display = 'none';
                            appContainer.style.display = 'flex';
                            window.GameInstance = new SpellingBeeEngine();
                            window.GameInstance.start();
                        }, 1000);
                    }, 500);
                }
            }, delay);
            delay += 200 + Math.random() * 200;
        });
    });
});
</script>
