<title>SYS.TERMINAL // PRISMATIC_LIQUID_BEE_v12.0.0</title>
<style>
    /* ==========================================================================
       CORE SYSTEM VARIABLES & RESET
       ========================================================================== */
    :root {
        --liquid-bg: rgba(5, 5, 10, 0.6);
        --glass-surface: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.15);
        --glass-highlight: rgba(255, 255, 255, 0.3);
        
        --text-primary: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.6);
        
        --rainbow-1: #ff0055;
        --rainbow-2: #ffaa00;
        --rainbow-3: #00ffaa;
        --rainbow-4: #00aaff;
        --rainbow-5: #aa00ff;
        
        --rainbow-gradient: linear-gradient(
            124deg, 
            var(--rainbow-1), var(--rainbow-2), var(--rainbow-3), 
            var(--rainbow-4), var(--rainbow-5), var(--rainbow-1)
        );
        
        --lvl-color: #00aaff;
        --glow-spread: 30px;
    }
    
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    body, html {
        width: 100%; 
        height: 100%; 
        overflow: hidden;
        background-color: #010102; 
        color: var(--text-primary);
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
        user-select: none;
        perspective: 1500px;
    }

    /* ==========================================================================
       CUSTOM SCROLLBARS
       ========================================================================== */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--liquid-bg); }
    ::-webkit-scrollbar-thumb { 
        background: var(--rainbow-gradient); 
        background-size: 200% 200%;
        border-radius: 10px; 
        border: 1px solid rgba(0,0,0,0.5);
        animation: rainbow-flow 3s linear infinite;
    }
    ::selection { background: var(--glass-highlight); color: #fff; }

    /* ==========================================================================
       MOVING RAINBOW BLURBS & LIQUID GLASS BACKGROUND
       ========================================================================== */
    #liquid-canvas {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
        z-index: 1; pointer-events: none;
        filter: blur(12px) contrast(140%) saturate(200%);
        opacity: 0.8; mix-blend-mode: screen;
    }

    .blurb-container {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 0; overflow: hidden; pointer-events: none;
        filter: blur(60px); opacity: 0.6;
    }

    .blurb {
        position: absolute; border-radius: 50%;
        animation: float-blurb 20s infinite ease-in-out alternate;
        mix-blend-mode: screen;
    }

    .blurb-1 { width: 40vw; height: 40vw; background: var(--rainbow-1); top: -10%; left: -10%; animation-delay: 0s; }
    .blurb-2 { width: 35vw; height: 35vw; background: var(--rainbow-3); top: 50%; right: -10%; animation-delay: -5s; }
    .blurb-3 { width: 45vw; height: 45vw; background: var(--rainbow-5); bottom: -20%; left: 20%; animation-delay: -10s; }
    .blurb-4 { width: 30vw; height: 30vw; background: var(--rainbow-2); top: 20%; left: 40%; animation-delay: -15s; }

    .glass-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.9) 100%);
        z-index: 2; pointer-events: none;
    }

    /* ==========================================================================
       KEYFRAME ANIMATIONS
       ========================================================================== */
    @keyframes rainbow-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes float-blurb {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33% { transform: translate(10vw, 10vh) scale(1.2) rotate(90deg); }
        66% { transform: translate(-10vw, 20vh) scale(0.8) rotate(180deg); }
        100% { transform: translate(5vw, -10vh) scale(1.1) rotate(270deg); }
    }

    @keyframes text-shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    @keyframes error-shake {
        0%, 100% { transform: translate3d(0, 0, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate3d(-15px, 0, 0); }
        20%, 40%, 60%, 80% { transform: translate3d(15px, 0, 0); }
    }

    @keyframes liquid-morph {
        0% { border-radius: 30px; }
        25% { border-radius: 40px 20px 40px 20px; }
        50% { border-radius: 20px 40px 20px 40px; }
        75% { border-radius: 40px 30px 20px 40px; }
        100% { border-radius: 30px; }
    }

    /* ==========================================================================
       LIQUID GLASS PANELS
       ========================================================================== */
    .liquid-panel {
        background: var(--glass-surface);
        backdrop-filter: blur(20px) saturate(180%) contrast(120%);
        -webkit-backdrop-filter: blur(20px) saturate(180%) contrast(120%);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        box-shadow: 
            0 20px 40px rgba(0, 0, 0, 0.7),
            inset 0 1px 2px rgba(255, 255, 255, 0.2),
            inset 0 -1px 2px rgba(0, 0, 0, 0.2),
            0 0 30px rgba(var(--lvl-color-rgb), 0.1);
        position: relative;
        overflow: hidden;
        animation: liquid-morph 10s ease-in-out infinite alternate;
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .liquid-panel::after {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
        animation: text-shimmer 8s infinite linear; pointer-events: none;
    }

    .rainbow-text {
        background: var(--rainbow-gradient); background-size: 300% auto;
        color: transparent; -webkit-background-clip: text; background-clip: text;
        animation: text-shimmer 4s linear infinite;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* ==========================================================================
       BOOT SEQUENCE STYLES
       ========================================================================== */
    #boot-sequence {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 10000; display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .boot-core {
        position: relative; width: 300px; height: 300px;
        display: flex; justify-content: center; align-items: center;
    }

    .boot-ring-1, .boot-ring-2, .boot-ring-3 {
        position: absolute; border-radius: 50%; border: 2px solid transparent;
    }

    .boot-ring-1 { width: 100%; height: 100%; border-top-color: var(--rainbow-1); border-bottom-color: var(--rainbow-3); animation: spin 2s linear infinite; filter: drop-shadow(0 0 15px var(--rainbow-1)); }
    .boot-ring-2 { width: 80%; height: 80%; border-left-color: var(--rainbow-2); border-right-color: var(--rainbow-4); animation: spin 1.5s linear infinite reverse; filter: drop-shadow(0 0 15px var(--rainbow-4)); }
    .boot-ring-3 { width: 60%; height: 60%; border-top-color: var(--rainbow-5); border-bottom-color: var(--rainbow-1); animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    #init-btn {
        position: absolute; padding: 20px 40px; font-size: 20px; font-weight: 900;
        border-radius: 40px; cursor: pointer; text-transform: uppercase;
        letter-spacing: 6px; background: rgba(0, 0, 0, 0.8);
        border: 2px solid rgba(255,255,255,0.2); color: #fff;
        backdrop-filter: blur(10px); transition: all 0.3s; z-index: 10;
    }

    #init-btn:hover { transform: scale(1.1); box-shadow: 0 0 40px var(--rainbow-3); border-color: var(--rainbow-3); letter-spacing: 8px; }

    #terminal-wrapper {
        position: absolute; bottom: 5vh; left: 5vw; width: 600px; height: 300px;
        overflow: hidden; mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }

    #terminal-logs {
        color: #00ffaa; font-family: 'Courier New', Courier, monospace;
        font-size: 14px; line-height: 1.6; text-shadow: 0 0 5px rgba(0,255,170,0.5);
        display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
    }

    /* ==========================================================================
       MAIN APPLICATION LAYOUT
       ========================================================================== */
    #app-container {
        display: none; grid-template-rows: auto 1fr auto;
        height: 100vh; width: 100vw; padding: 3vh 3vw; gap: 3vh;
        position: relative; z-index: 10; transform-style: preserve-3d;
    }

    header {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 20px 40px; transform: translateZ(50px);
    }

    .level-badge { display: flex; flex-direction: column; }
    #level-display { font-size: 52px; font-weight: 900; letter-spacing: 8px; margin-bottom: 5px; }
    .level-sub { font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--text-dim); }

    .combo-meter-container { display: flex; flex-direction: column; align-items: center; width: 350px; }
    .combo-text { font-size: 18px; font-weight: 900; letter-spacing: 6px; margin-bottom: 12px; }
    .combo-bar-bg { width: 100%; height: 25px; border-radius: 20px; background: rgba(0,0,0,0.8); border: 2px solid var(--glass-border); box-shadow: inset 0 5px 10px rgba(0,0,0,0.9); overflow: hidden; }
    #combo-fill { height: 100%; width: 0%; border-radius: 20px; background: var(--rainbow-gradient); background-size: 300% 300%; animation: rainbow-flow 1.5s linear infinite; transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .score-board { display: flex; gap: 3vw; justify-content: flex-end; }
    .stat-card { display: flex; flex-direction: column; align-items: flex-end; padding: 15px 30px; border-radius: 25px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
    .stat-val { font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
    .stat-lbl { font-size: 12px; color: var(--text-dim); letter-spacing: 4px; margin-top: 5px; }

    main { display: flex; justify-content: center; align-items: center; perspective: 2000px; }

    .mainframe-core {
        width: 100%; max-width: 1100px; padding: 80px;
        display: flex; flex-direction: column; align-items: center;
        transform: translateZ(100px);
        box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 2px 10px rgba(255,255,255,0.2), 0 0 150px rgba(var(--lvl-color-rgb), 0.2);
    }

    .mainframe-core.success-state { transform: translateZ(150px) scale(1.05); box-shadow: 0 0 150px rgba(0, 255, 170, 0.5), inset 0 0 80px rgba(0, 255, 170, 0.2); border-color: rgba(0, 255, 170, 0.8); }
    .mainframe-core.error-state { transform: translateZ(50px) scale(0.95); box-shadow: 0 0 150px rgba(255, 0, 85, 0.5), inset 0 0 80px rgba(255, 0, 85, 0.2); border-color: rgba(255, 0, 85, 0.8); animation: error-shake 0.4s both; }

    .action-grid { display: flex; gap: 25px; margin-bottom: 50px; width: 100%; justify-content: center; flex-wrap: wrap; }
    
    .glass-btn {
        background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2);
        color: #fff; padding: 20px 40px; font-size: 18px; font-weight: 800;
        border-radius: 35px; cursor: pointer; letter-spacing: 5px;
        backdrop-filter: blur(10px); transition: all 0.3s; position: relative; overflow: hidden;
    }
    .glass-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); transform: skewX(-20deg); transition: left 0.5s ease; }
    .glass-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
    .glass-btn:hover::before { left: 200%; }
    .glass-btn:active { transform: translateY(2px); }

    .voice-toggle-btn { border-color: var(--rainbow-5); text-shadow: 0 0 10px var(--rainbow-5); }
    .skip-btn { border-color: var(--rainbow-1); text-shadow: 0 0 10px var(--rainbow-1); }

    .input-zone { position: relative; width: 100%; margin-bottom: 40px; }
    
    #console-input {
        width: 100%; background: rgba(0, 0, 0, 0.6);
        border: 3px solid rgba(255,255,255,0.1); border-radius: 50px;
        color: #fff; font-size: 72px; padding: 40px; text-align: center; outline: none;
        font-family: 'SF Pro Display', sans-serif; letter-spacing: 20px; font-weight: 200;
        text-transform: uppercase; transition: all 0.3s;
        box-shadow: inset 0 10px 30px rgba(0,0,0,0.8);
    }
    #console-input:focus { border-color: var(--lvl-color); background: rgba(0, 0, 0, 0.8); box-shadow: inset 0 10px 30px rgba(0,0,0,0.9), 0 0 60px rgba(var(--lvl-color-rgb), 0.5); transform: scale(1.02); }
    #console-input:disabled { opacity: 0.3; cursor: not-allowed; }

    #visual-feedback { height: 70px; font-size: 40px; letter-spacing: 10px; font-weight: 900; text-align: center; opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: translateY(30px); text-shadow: 0 0 30px currentColor; }
    .msg-success { color: #00ffaa; }
    .msg-error { color: #ff0055; }

    #context-panel {
        margin-top: 40px; padding: 30px 50px; background: rgba(0,0,0,0.5);
        border-radius: 30px; font-size: 24px; color: var(--text-dim);
        min-height: 100px; font-weight: 300; display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    }

    footer { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; padding: 30px 50px; transform: translateZ(50px); }
    .diag-cluster { display: flex; gap: 5vw; justify-content: flex-start; }
    .diag-node { display: flex; flex-direction: column; }
    .diag-val { font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
    .diag-lbl { font-size: 12px; color: var(--text-dim); letter-spacing: 4px; margin-top: 5px;}
    .center-diag { display: flex; justify-content: center; align-items: center; }
    .right-diag { display: flex; justify-content: flex-end; align-items: center; gap: 30px;}

    .progress-ring { position: relative; width: 100px; height: 100px; }
    .progress-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));}
    .progress-ring circle { fill: transparent; stroke-width: 8; stroke-linecap: round; }
    .progress-ring .bg { stroke: rgba(255,255,255,0.1); }
    .progress-ring .fill { stroke: url(#rainbow-grad); stroke-dasharray: 264; stroke-dashoffset: 264; transition: stroke-dashoffset 0.5s ease; }
    .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: 900; }

    /* Theming Variables */
    body.lvl-1 { --lvl-color: #00aaff; --lvl-color-rgb: 0, 170, 255; }
    body.lvl-2 { --lvl-color: #00ffaa; --lvl-color-rgb: 0, 255, 170; }

    body.lvl-5 { --lvl-color: #aa00ff; --lvl-color-rgb: 170, 0, 255; }

</style>
</head>

/**
 * ==========================================================================
 * LIQUID GLASS CANVAS ENGINE (Particle/Fluid Sim)
 * ==========================================================================
 */
class LiquidCanvas {
    constructor() {
        this.canvas = document.getElementById('liquid-canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.particles = [];
        this.numParticles = 250;
        this.colors = ['#ff0055', '#ffaa00', '#00ffaa', '#00aaff', '#aa00ff'];
        this.mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
        
        this.init();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
        
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('mousemove', (e) => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
    }
    
    init() {
        this.resize();
        this.particles = [];
        for (let i = 0; i < this.numParticles; i++) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                radius: Math.random() * 80 + 30,
                color: this.colors[Math.floor(Math.random() * this.colors.length)],
                baseRadius: Math.random() * 80 + 30
            });
        }
    }
    
    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }
    
    animate() {
        this.ctx.fillStyle = 'rgba(2, 2, 5, 0.4)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            
            if (p.x - p.radius < 0 || p.x + p.radius > this.canvas.width) p.vx *= -1;
            if (p.y - p.radius < 0 || p.y + p.radius > this.canvas.height) p.vy *= -1;
            
            let dx = this.mouse.x - p.x;
            let dy = this.mouse.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 400) {
                p.x -= dx * 0.01;
                p.y -= dy * 0.01;
                p.radius = p.baseRadius + (400 - dist) * 0.4;
            } else {
                p.radius = p.baseRadius;
            }
            
            let gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            gradient.addColorStop(0, p.color);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = gradient;
            this.ctx.fill();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(this.animate);
    }
    
    burst(x, y, color) {
        for(let i=0; i<40; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 25,
                vy: (Math.random() - 0.5) * 25,
                radius: Math.random() * 100 + 50,
                color: color,
                baseRadius: 20,
                decay: true
            });
        }
        setTimeout(() => {
            this.particles = this.particles.filter(p => !p.decay);
        }, 1500);
    }
}

/**
 * ==========================================================================
 * AUDIO SYNTHESIS ENGINE (10 Selectable Voices)
 * strictly reads only the word text to prevent random numbers/letters.
 * ==========================================================================
 */
class CyberAudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.synth = window.speechSynthesis;
        this.availableVoices = [];
        this.currentVoiceIndex = 0;
        
        this.btnVoice = document.getElementById('btn-voice');
        this.initVoices();
    }
    
    initVoices() {
        const populate = () => {
            let allVoices = this.synth.getVoices();
            // Filter strictly for English
            let engVoices = allVoices.filter(v => v.lang.startsWith('en'));
            if(engVoices.length === 0) engVoices = allVoices; 
            
            // Get exactly 10 distinct voices if available
            this.availableVoices = engVoices.slice(0, 10);
            if(this.availableVoices.length > 0) {
                this.updateVoiceLabel();
            }
        };
        populate();
        this.synth.onvoiceschanged = populate;
        
        this.btnVoice.addEventListener('click', () => {
            if(this.availableVoices.length === 0) return;
            this.currentVoiceIndex = (this.currentVoiceIndex + 1) % this.availableVoices.length;
            this.updateVoiceLabel();
            this.createOsc(1000, 'sine', 0.1, 0.1); // beep
        });
    }
    
    updateVoiceLabel() {
        let v = this.availableVoices[this.currentVoiceIndex];
        let shortName = v.name.split(' ')[0] || "VOICE";
        this.btnVoice.textContent = `♫ VOICE: ${shortName.toUpperCase()} (${this.currentVoiceIndex + 1}/${this.availableVoices.length})`;
    }
    
    speakWord(text, rate = 1.0, pitch = 1.0) {
        if(this.synth.speaking) this.synth.cancel();
        
        // Strictly sanitize the text to purely alphabetic characters to stop weird symbols/numbers
        let cleanText = text.replace(/[^a-zA-Z]/g, '');
        
        let utter = new SpeechSynthesisUtterance(cleanText);
        if(this.availableVoices.length > 0) {
            utter.voice = this.availableVoices[this.currentVoiceIndex];
        }
        utter.rate = rate;
        utter.pitch = pitch;
        this.synth.speak(utter);
    }
    
    createOsc(freq, type, time, vol, sweepFreq = null) {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(sweepFreq) osc.frequency.exponentialRampToValueAtTime(sweepFreq, this.ctx.currentTime + time);
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);
        
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + time);
    }
    
    playKeyStroke() { this.createOsc(800 + Math.random()*400, 'sine', 0.05, 0.05); }
    
    playSuccess(comboLevel) {
        let baseFreq = 440 + (comboLevel * 25); 
        this.createOsc(baseFreq, 'sine', 0.2, 0.1);
        setTimeout(() => this.createOsc(baseFreq * 1.5, 'triangle', 0.3, 0.1), 100);
        setTimeout(() => this.createOsc(baseFreq * 2, 'square', 0.4, 0.05), 200);
    }
    
    playError() {
        this.createOsc(200, 'sawtooth', 0.3, 0.2, 100);
        setTimeout(() => this.createOsc(150, 'square', 0.4, 0.2, 50), 100);
    }
    
    playLevelUp() {
        this.createOsc(220, 'triangle', 1.5, 0.2, 880);
        setTimeout(() => this.createOsc(330, 'triangle', 1.5, 0.2, 1320), 200);
        setTimeout(() => this.createOsc(440, 'triangle', 1.5, 0.2, 1760), 400);
    }
}

 */
class SpellingBeeEngine {
    constructor() {
        this.level = 1;
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 50;
        this.multiplier = 1.0;
        
        this.wordIndex = 0;
        this.wordsTyped = 0;
        this.startTime = 0;
        
        this.currentWord = "";
        this.list = [];
        
        this.audio = new CyberAudioEngine();
        this.liquid = new LiquidCanvas();
        
        // Cache DOM elements
        this.uiScore = document.getElementById('ui-score');
        this.uiMult = document.getElementById('ui-mult');
        this.uiLvl = document.getElementById('level-display');
        this.uiDesc = document.getElementById('level-desc');
        this.uiComboFill = document.getElementById('combo-fill');
        
        this.uiInput = document.getElementById('console-input');
        this.uiFeedback = document.getElementById('visual-feedback');
        this.uiCtxDef = document.getElementById('context-def');
        this.mainUI = document.getElementById('main-ui');
        
        this.uiWPM = document.getElementById('ui-wpm');
        this.uiAcc = document.getElementById('ui-acc');
        this.uiRem = document.getElementById('ui-rem');
        
        this.progressCircle = document.getElementById('lvl-progress-circle');
        this.progressText = document.getElementById('lvl-progress-text');
        
        this.bindEvents();
    }
    
    start() {
        this.startTime = Date.now();
        this.loadLevel(1);
        setInterval(() => this.updateDiagnostics(), 1000);
    }
    
    bindEvents() {
        this.uiInput.addEventListener('keydown', (e) => {
            if(e.key !== 'Enter') this.audio.playKeyStroke();
            if(e.key === 'Enter') this.validateInput();
        });
        
        document.getElementById('btn-play').addEventListener('click', () => {
            this.uiInput.focus();
            this.broadcastWord();
        });
        
        document.getElementById('btn-skip').addEventListener('click', () => {
            this.combo = 0; 
            this.updateStatsUI();
            this.triggerVisualFeedback(`OVERRIDDEN: ${this.currentWord.toUpperCase()}`, false);
            this.nextWord();
            this.uiInput.focus();
        });
    }
    
    loadLevel(l) {
        this.level = l;
        this.wordIndex = 0;
        this.list = Lexicon[`lvl${l}`];
        
        document.body.className = `lvl-${l}`;
        this.uiLvl.textContent = `PHASE 0${l}`;
        
        const descArr = [
            "NEURAL BASELINE ESTABLISHED",
            "SYNAPTIC PATHWAYS ENHANCED",
            "COGNITIVE OVERCLOCK ACTIVE",
            "LINGUISTIC SINGULARITY IMMINENT",
            "TRANSCENDENTAL LEXICON REACHED"
        ];
        this.uiDesc.textContent = descArr[l-1];
        
        this.audio.playLevelUp();
        
        let rect = this.mainUI.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top + rect.height/2, '#ffffff');
        
        this.nextWord();
    }
    
    getDDA() {
        let rate = 0.85 + (this.level * 0.1) + (this.combo * 0.015);
        let pitch = 1.0 - (this.level * 0.05);
        return { rate: Math.min(rate, 1.8), pitch: Math.max(pitch, 0.7) };
    }
    
    broadcastWord() {
        let params = this.getDDA();
        this.audio.speakWord(this.currentWord, params.rate, params.pitch);
    }
    
    nextWord() {
        if(this.wordIndex >= this.list.length) {
            if(this.level < 5) this.loadLevel(this.level + 1);
            else this.triggerVictory();
            return;
        }
        
        this.currentWord = this.list[this.wordIndex];
        this.uiInput.value = '';
        this.uiInput.disabled = false;
        this.uiInput.focus();
        
        // Hide length info or definitions, just state waiting for input
        this.uiCtxDef.textContent = `>> AWAITING AUDIO TRANSCRIPTION...`;
        this.updateDiagnosticsUI();
        
        setTimeout(() => this.broadcastWord(), 600);
    }
    
    validateInput() {
        let inputVal = this.uiInput.value.trim().toLowerCase();
        if(inputVal === "") return;
        
        if(inputVal === this.currentWord.toLowerCase()) {
            this.handleSuccess();
        } else {
            this.handleError();
        }
    }
    
    handleSuccess() {
        this.audio.playSuccess(this.combo);
        
        this.combo++;
        this.wordsTyped++;
        this.multiplier = 1.0 + (Math.min(this.combo, this.maxCombo) * 0.1);
        
        let basePoints = this.currentWord.length * 20;
        this.score += Math.floor(basePoints * this.multiplier * this.level);
        
        this.triggerVisualFeedback("LINK STABILIZED", true);
        
        let rect = this.uiInput.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top, '#00ffaa');
        
        this.wordIndex++;
        this.updateStatsUI();
        this.nextWord();
    }
    
    handleError() {
        this.audio.playError();
        this.combo = 0;
        this.multiplier = 1.0;
        
        this.triggerVisualFeedback("SYSTEM CORRUPTION", false);
        
        let rect = this.uiInput.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top, '#ff0055');
        
        this.uiInput.value = '';
        this.updateStatsUI();
    }
    
    triggerVisualFeedback(msg, isSuccess) {
        this.uiFeedback.textContent = msg;
        this.uiFeedback.className = isSuccess ? "msg-success" : "msg-error";
        
        this.uiFeedback.style.opacity = '0';
        this.uiFeedback.style.transform = 'translateY(30px)';
        void this.uiFeedback.offsetWidth; // Reflow
        this.uiFeedback.style.opacity = '1';
        this.uiFeedback.style.transform = 'translateY(0)';
        
        this.mainUI.classList.add(isSuccess ? 'success-state' : 'error-state');
        
        setTimeout(() => {
            this.uiFeedback.style.opacity = '0';
            this.uiFeedback.style.transform = 'translateY(-30px)';
            this.mainUI.classList.remove('success-state', 'error-state');
        }, 800);
    }
    
    updateStatsUI() {
        this.uiScore.textContent = this.score.toString().padStart(8, '0');
        this.uiMult.textContent = this.multiplier.toFixed(2) + 'x';
        
        let comboPercent = Math.min((this.combo / this.maxCombo) * 100, 100);
        this.uiComboFill.style.width = `${comboPercent}%`;
        
        if(comboPercent === 100) {
            this.uiComboFill.style.boxShadow = "0 0 30px #fff, 0 0 60px var(--rainbow-4)";
        } else {
            this.uiComboFill.style.boxShadow = "0 0 15px rgba(255,255,255,0.7)";
        }
    }
    
    updateDiagnosticsUI() {
        this.uiRem.textContent = this.list.length - this.wordIndex;
        
        let percent = (this.wordIndex / this.list.length) * 100;
        let offset = 264 - (264 * percent) / 100;
        this.progressCircle.style.strokeDashoffset = offset;
        this.progressText.textContent = Math.floor(percent) + '%';
    }
    
    updateDiagnostics() {
        if(this.startTime === 0) return;
        
        let minutes = (Date.now() - this.startTime) / 60000;
        if(minutes > 0) {
            let wpm = this.wordsTyped / minutes;
            this.uiWPM.textContent = wpm.toFixed(1);
        }
        
        if(this.wordIndex > 0) {
            let acc = (this.wordsTyped / Math.max(this.wordIndex, 1)) * 100;
            this.uiAcc.textContent = Math.min(acc, 100).toFixed(1) + '%';
        }
    }
    
    triggerVictory() {
        this.uiInput.disabled = true;
        this.uiInput.value = "DOMINANCE";
        this.uiCtxDef.innerHTML = "<span class='rainbow-text'>GLOBAL MAINFRAME OVERRIDDEN. ALL SECTORS SECURED.</span>";
        this.audio.speakWord("System override complete. Global linguistic dominance achieved.", 1.0, 1.0);
        
        setInterval(() => {
            this.liquid.burst(Math.random()*window.innerWidth, Math.random()*window.innerHeight, this.liquid.colors[Math.floor(Math.random()*this.liquid.colors.length)]);
        }, 250);
    }
}

/**
 * ==========================================================================
 * BOOT SEQUENCE
 * ==========================================================================
 */
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('init-btn');
    const bootContainer = document.getElementById('boot-sequence');
    const appContainer = document.getElementById('app-container');
    const logs = document.getElementById('terminal-logs');
    
    const bootSequenceLines = [
        "KERNEL: Booting OS core...",
        "SYS: Loading massive lexicon...",
        "SYS: 1500 entities secured [OK]",
        "NET: Establishing Neural Link Protocol v12...",
        "AUDIO: Syncing 10-channel voice modulation...",
        "VFX: Rendering massive liquid particle simulation...",
        "SEC: Firewall heuristics bypassed...",
        "CRIT: Proceed with extreme caution.",
        "SYS: Handshake complete. Deployment authorized."
    ];
    
    btn.addEventListener('click', () => {
        btn.style.transform = 'scale(0)';
        btn.style.opacity = '0';
        
        let delay = 0;
        bootSequenceLines.forEach((line, index) => {
            setTimeout(() => {
                let p = document.createElement('div');
                p.textContent = `> ${line}`;
                logs.appendChild(p);
                
                let tempAudio = new (window.AudioContext || window.webkitAudioContext)();
                let osc = tempAudio.createOscillator();
                let gain = tempAudio.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1000 + (Math.random()*300), tempAudio.currentTime);
                gain.gain.setValueAtTime(0.05, tempAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, tempAudio.currentTime + 0.05);
                osc.connect(gain); gain.connect(tempAudio.destination);
                osc.start(); osc.stop(tempAudio.currentTime + 0.05);
                
                if (index === bootSequenceLines.length - 1) {
                    setTimeout(() => {
                        bootContainer.style.opacity = '0';
                        setTimeout(() => {
                            bootContainer.style.display = 'none';
                            appContainer.style.display = 'grid';
                            window.GameInstance = new SpellingBeeEngine();
                            window.GameInstance.start();
                        }, 2000);
                    }, 1000);
                }
            }, delay);
            delay += 300 + Math.random() * 300;
        });
    });
});
