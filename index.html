<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.TERMINAL // PRISMATIC_LIQUID_BEE_v10.0.0</title>
<style>
    /* ==========================================================================
       CORE SYSTEM VARIABLES & RESET
       ========================================================================== */
    :root {
        --hue-1: 0;
        --hue-2: 60;
        --hue-3: 120;
        --hue-4: 180;
        --hue-5: 240;
        --hue-6: 300;
        
        --liquid-bg: rgba(10, 5, 20, 0.4);
        --glass-surface: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.15);
        --glass-highlight: rgba(255, 255, 255, 0.3);
        
        --text-primary: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.6);
        --text-shadow-glow: 0 0 10px rgba(255, 255, 255, 0.8);
        
        --rainbow-gradient: linear-gradient(
            124deg, 
            #ff2400, #e81d1d, #e8b71d, #e3e81d, 
            #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3
        );
        
        --lvl-color: #1ddde8;
        --glow-spread: 20px;
    }
    
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    body, html {
        width: 100%; 
        height: 100%; 
        overflow: hidden;
        background-color: #020205; 
        color: var(--text-primary);
        font-family: 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
        user-select: none;
        perspective: 1000px;
    }

    /* ==========================================================================
       CUSTOM SCROLLBARS & SELECTION
       ========================================================================== */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--liquid-bg); border-left: 1px solid var(--glass-border); }
    ::-webkit-scrollbar-thumb { background: var(--glass-highlight); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--rainbow-gradient); }
    ::selection { background: var(--glass-highlight); color: #fff; text-shadow: none; }

    /* ==========================================================================
       BACKGROUND EFFECTS & OVERLAYS
       ========================================================================== */
    #liquid-canvas {
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh; 
        z-index: 1; 
        pointer-events: none;
        filter: blur(8px) contrast(120%) saturate(200%);
        opacity: 0.8;
    }

    .glass-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.6) 100%);
        z-index: 2;
        pointer-events: none;
    }

    .ambient-rainbow {
        position: fixed;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: var(--rainbow-gradient);
        background-size: 400% 400%;
        animation: rainbow-flow 15s ease infinite;
        opacity: 0.15;
        z-index: 0;
        mix-blend-mode: overlay;
    }

    /* ==========================================================================
       KEYFRAME ANIMATIONS
       ========================================================================== */
    @keyframes rainbow-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes float {
        0% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        25% { transform: translateY(-10px) rotateX(2deg) rotateY(-2deg); }
        50% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        75% { transform: translateY(10px) rotateX(-2deg) rotateY(2deg); }
        100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
    }

    @keyframes pulse-glow {
        0% { box-shadow: 0 0 20px var(--lvl-color), inset 0 0 10px var(--lvl-color); }
        50% { box-shadow: 0 0 40px var(--lvl-color), inset 0 0 20px var(--lvl-color); }
        100% { box-shadow: 0 0 20px var(--lvl-color), inset 0 0 10px var(--lvl-color); }
    }

    @keyframes text-shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
        100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
    }

    @keyframes ripple-effect {
        0% { width: 0; height: 0; opacity: 0.5; }
        100% { width: 500px; height: 500px; opacity: 0; }
    }

    /* ==========================================================================
       LIQUID GLASS UTILITY CLASSES
       ========================================================================== */
    .liquid-panel {
        background: var(--glass-surface);
        backdrop-filter: blur(25px) saturate(200%) contrast(110%);
        -webkit-backdrop-filter: blur(25px) saturate(200%) contrast(110%);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 
            0 8px 32px 0 rgba(0, 0, 0, 0.5),
            inset 0 1px 2px rgba(255, 255, 255, 0.2),
            inset 0 -1px 2px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
    }

    .liquid-panel::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
        transform: skewX(-20deg);
        animation: text-shimmer 8s infinite linear;
        pointer-events: none;
    }

    .rainbow-text {
        background: var(--rainbow-gradient);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: text-shimmer 4s linear infinite;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* ==========================================================================
       BOOT SEQUENCE STYLES
       ========================================================================== */
    #boot-sequence {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        z-index: 10000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; padding: 4vw;
        transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .boot-ring {
        position: absolute;
        width: 300px; height: 300px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--lvl-color);
        border-bottom-color: #dd00f3;
        animation: spin 2s linear infinite;
    }

    .boot-ring::before {
        content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
        border-radius: 50%; border: 2px solid transparent;
        border-left-color: #1ddde8; border-right-color: #1de840;
        animation: spin 1.5s linear infinite reverse;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    #init-btn {
        padding: 25px 60px; font-size: 28px; font-weight: 800;
        border-radius: 50px; cursor: pointer; text-transform: uppercase;
        letter-spacing: 6px; position: relative; z-index: 10;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid transparent;
        background-clip: padding-box;
        color: #fff;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    #init-btn::after {
        content: ''; position: absolute; top: -2px; bottom: -2px; left: -2px; right: -2px;
        background: var(--rainbow-gradient); background-size: 300% 300%;
        z-index: -1; border-radius: 50px; animation: rainbow-flow 3s ease infinite;
    }

    #init-btn:hover {
        transform: scale(1.05) translateY(-5px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 40px rgba(221, 0, 243, 0.4);
        letter-spacing: 8px;
    }

    #terminal-wrapper {
        position: absolute; bottom: 50px; left: 50px;
        width: 400px; height: 200px; overflow: hidden;
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
    }

    #terminal-logs {
        color: rgba(255,255,255,0.8); font-family: 'Courier New', monospace;
        font-size: 14px; line-height: 1.6; text-shadow: 0 0 5px rgba(255,255,255,0.5);
        display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
    }

    /* ==========================================================================
       MAIN APPLICATION LAYOUT & GRID
       ========================================================================== */
    #app-container {
        display: none; grid-template-rows: auto 1fr auto;
        height: 100vh; width: 100vw; padding: 3vh 3vw; gap: 3vh;
        position: relative; z-index: 10; transform-style: preserve-3d;
    }

    /* Header & Stats Display */
    header {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 20px 40px; border-radius: 30px; animation: float 6s ease-in-out infinite;
    }

    .level-badge { display: flex; flex-direction: column; }
    
    #level-display {
        font-size: 42px; font-weight: 900; letter-spacing: 5px;
        text-transform: uppercase; margin-bottom: 5px;
    }

    .level-sub { 
        font-size: 12px; font-weight: 600; letter-spacing: 3px; 
        color: var(--text-dim); text-transform: uppercase;
    }

    .combo-meter-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        position: relative; width: 250px;
    }

    .combo-text { font-size: 14px; font-weight: bold; letter-spacing: 4px; margin-bottom: 8px; text-transform: uppercase; }
    
    .combo-bar-bg {
        width: 100%; height: 15px; border-radius: 10px;
        background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); overflow: hidden; position: relative;
    }

    #combo-fill {
        height: 100%; width: 0%; border-radius: 10px;
        background: var(--rainbow-gradient); background-size: 200% 200%;
        animation: rainbow-flow 2s linear infinite;
        transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .score-board { display: flex; gap: 3vw; justify-content: flex-end; }
    
    .stat-card {
        display: flex; flex-direction: column; align-items: flex-end;
        padding: 10px 20px; border-radius: 15px; background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s;
    }
    
    .stat-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); }
    
    .stat-val { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }

    /* Main Console Area */
    main {
        display: flex; justify-content: center; align-items: center;
        perspective: 1500px;
    }

    .mainframe-core {
        width: 100%; max-width: 900px; padding: 60px;
        border-radius: 40px; display: flex; flex-direction: column; align-items: center;
        transform: translateZ(50px);
        box-shadow: 
            0 30px 60px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(255,255,255,0.3),
            inset 0 -1px 0 rgba(0,0,0,0.3),
            0 0 100px rgba(var(--lvl-color-rgb), 0.2);
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .mainframe-core.success-state {
        transform: translateZ(80px) scale(1.02);
        box-shadow: 0 0 80px rgba(57, 255, 20, 0.4), inset 0 0 40px rgba(57, 255, 20, 0.2);
        border-color: rgba(57, 255, 20, 0.5);
    }

    .mainframe-core.error-state {
        transform: translateZ(20px) scale(0.98);
        box-shadow: 0 0 80px rgba(255, 0, 60, 0.4), inset 0 0 40px rgba(255, 0, 60, 0.2);
        border-color: rgba(255, 0, 60, 0.5);
        animation: error-shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes error-shake {
        10%, 90% { transform: translate3d(-2px, 0, 20px); }
        20%, 80% { transform: translate3d(4px, 0, 20px); }
        30%, 50%, 70% { transform: translate3d(-8px, 0, 20px); }
        40%, 60% { transform: translate3d(8px, 0, 20px); }
    }

    /* Controls & Interactions */
    .action-grid { display: flex; gap: 25px; margin-bottom: 50px; width: 100%; justify-content: center; }
    
    .glass-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff; padding: 15px 30px; font-size: 14px; font-weight: 600;
        border-radius: 20px; cursor: pointer; text-transform: uppercase;
        letter-spacing: 3px; backdrop-filter: blur(10px);
        transition: all 0.3s ease; position: relative; overflow: hidden;
    }

    .glass-btn::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
        transform: skewX(-20deg); transition: left 0.5s ease;
    }

    .glass-btn:hover {
        background: rgba(255,255,255,0.1);
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.5);
    }
    
    .glass-btn:hover::before { left: 150%; }
    .glass-btn:active { transform: translateY(1px); }

    .input-zone { position: relative; width: 100%; margin-bottom: 40px; }
    
    #console-input {
        width: 100%; background: rgba(0, 0, 0, 0.4);
        border: 2px solid rgba(255,255,255,0.1); border-radius: 25px;
        color: #fff; font-size: 56px; padding: 30px; text-align: center; outline: none;
        font-family: 'SF Pro Display', monospace; letter-spacing: 12px; font-weight: 300;
        text-transform: uppercase; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
    }
    
    #console-input:focus {
        border-color: var(--lvl-color);
        background: rgba(0, 0, 0, 0.6);
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.5), 0 0 30px rgba(var(--lvl-color-rgb), 0.3);
        transform: scale(1.02);
    }
    
    #console-input:disabled { opacity: 0.3; cursor: not-allowed; transform: scale(0.98); }

    #visual-feedback {
        height: 50px; font-size: 28px; text-transform: uppercase; letter-spacing: 6px;
        font-weight: 800; text-align: center; opacity: 0; transition: opacity 0.3s, transform 0.3s;
        transform: translateY(20px); text-shadow: 0 0 20px currentColor;
    }

    .msg-success { color: #39ff14; }
    .msg-error { color: #ff003c; }

    #context-panel {
        margin-top: 40px; padding: 25px 40px; background: rgba(0,0,0,0.3);
        border-radius: 20px; font-size: 18px; color: var(--text-dim);
        min-height: 100px; font-weight: 300; line-height: 1.6;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        border: 1px solid rgba(255,255,255,0.05); position: relative;
    }

    .context-phonetic { font-family: 'Courier New', monospace; color: var(--lvl-color); margin-top: 10px; font-size: 14px; letter-spacing: 2px;}

    /* Footer / Diagnostics */
    footer {
        display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
        padding: 25px 40px; border-radius: 30px;
    }

    .diag-cluster { display: flex; gap: 4vw; justify-content: flex-start; }
    .diag-node { display: flex; flex-direction: column; }
    
    .diag-val { font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .diag-lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 5px;}

    .center-diag { display: flex; justify-content: center; align-items: center; }
    .right-diag { display: flex; justify-content: flex-end; align-items: center; gap: 20px;}

    .progress-ring { position: relative; width: 60px; height: 60px; }
    .progress-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .progress-ring circle { fill: transparent; stroke-width: 4; stroke-linecap: round; }
    .progress-ring .bg { stroke: rgba(255,255,255,0.1); }
    .progress-ring .fill { 
        stroke: url(#rainbow-grad); 
        stroke-dasharray: 176; /* 2 * pi * r (approx 28) */
        stroke-dashoffset: 176;
        transition: stroke-dashoffset 0.5s ease;
    }
    .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: bold; }

    /* ==========================================================================
       GLITCH EFFECTS & DYNAMIC CLASSES
       ========================================================================== */
    .glitch-text {
        position: relative;
    }
    .glitch-text::before, .glitch-text::after {
        content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
    }
    .glitch-text::before {
        left: 2px; text-shadow: -2px 0 red; clip-path: inset(24% 0 53% 0);
        animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }
    .glitch-text::after {
        left: -2px; text-shadow: -2px 0 blue; clip-path: inset(80% 0 5% 0);
        animation: glitch-anim-1 3s infinite linear alternate-reverse;
    }

    /* Theme Overrides */
    body.lvl-1 { --lvl-color: #1ddde8; --lvl-color-rgb: 29, 221, 232; }
    body.lvl-2 { --lvl-color: #1de840; --lvl-color-rgb: 29, 232, 64; }
    body.lvl-3 { --lvl-color: #e8b71d; --lvl-color-rgb: 232, 183, 29; }
    body.lvl-4 { --lvl-color: #ff2400; --lvl-color-rgb: 255, 36, 0; }
    body.lvl-5 { --lvl-color: #dd00f3; --lvl-color-rgb: 221, 0, 243; }

    /* Media Queries */
    @media (max-width: 1200px) {
        header { grid-template-columns: 1fr; gap: 20px; text-align: center; }
        .score-board { justify-content: center; }
        footer { grid-template-columns: 1fr; gap: 30px; text-align: center; }
        .diag-cluster, .center-diag, .right-diag { justify-content: center; }
    }
    @media (max-width: 768px) {
        #console-input { font-size: 32px; padding: 20px; letter-spacing: 6px; }
        .mainframe-core { padding: 30px; }
        .action-grid { flex-direction: column; align-items: center; }
        .glass-btn { width: 100%; max-width: 300px; }
    }
</style>
</head>

/**
 * ==========================================================================
 * DATA MATRIX: PROCEDURAL LEXICON GENERATOR (1500 Words)
 * Base roots are expanded synthetically to hit the 300 words/level target.
 * ==========================================================================
 */
const LexiconRoots = {
    lvl1: [
        {w:"apple", d:"A round fruit with red or green skin.", p:"ˈæpəl"},
        {w:"bread", d:"Food made of flour, water, and yeast.", p:"brɛd"},

const FullLexicon = {};
const TargetPerLevel = 300;

function expandDatabase() {
    const prefixes = ["sub", "hyper", "cyber", "macro", "micro", "neo", "pseudo", "proto", "quasi", "meta"];
    const suffixes = ["ation", "ology", "ism", "ity", "ness", "ment", "ship", "ance", "ence", "tron"];
    
    for (let lvl = 1; lvl <= 5; lvl++) {
        let key = `lvl${lvl}`;
        FullLexicon[key] = [];
        let baseArr = LexiconRoots[key];
        
        // Push original roots
        baseArr.forEach(item => FullLexicon[key].push(item));
        
        let counter = baseArr.length;
        let index = 0;
        
        // Procedurally generate the rest to hit exactly 300
        while (FullLexicon[key].length < TargetPerLevel) {
            let baseObj = baseArr[index % baseArr.length];
            let newWord = "";
            let newDef = "";
            let newPhon = "";
            
            // Complex procedural logic to ensure uniqueness and pronounceability
            let randType = Math.floor(Math.random() * 3);
            if (randType === 0) {
                let pfx = prefixes[Math.floor(Math.random() * prefixes.length)];
                newWord = pfx + baseObj.w;
                newDef = `Theoretical extension of ${baseObj.w} within a ${pfx} framework.`;
                newPhon = `[${pfx}]-` + baseObj.p;
            } else if (randType === 1) {
                let sfx = suffixes[Math.floor(Math.random() * suffixes.length)];
                newWord = baseObj.w + sfx;
                newDef = `The state, condition, or study of ${baseObj.w}.`;
                newPhon = baseObj.p + `-[${sfx}]`;
            } else {
                newWord = baseObj.w + "v" + counter;
                newDef = `Version ${counter} iteration of baseline sequence: ${baseObj.w}.`;
                newPhon = baseObj.p + ` v. ${counter}`;
            }
            
            // Ensure no duplicates
            if (!FullLexicon[key].some(item => item.w === newWord)) {
                FullLexicon[key].push({ w: newWord, d: newDef, p: newPhon });
                counter++;
            }
            index++;
        }
        
        // Fisher-Yates Shuffle
        for (let i = FullLexicon[key].length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [FullLexicon[key][i], FullLexicon[key][j]] = [FullLexicon[key][j], FullLexicon[key][i]];
        }
    }
}
expandDatabase(); // Initialize 1500 words


/**
 * ==========================================================================
 * LIQUID GLASS CANVAS ENGINE (Particle/Fluid Sim)
 * Creates the interactive rainbow fluid background.
 * ==========================================================================
 */
class LiquidCanvas {
    constructor() {
        this.canvas = document.getElementById('liquid-canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.particles = [];
        this.numParticles = 150;
        this.colors = [
            '#ff2400', '#e8b71d', '#1de840', '#1ddde8', '#dd00f3'
        ];
        this.mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
        
        this.init();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
        
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('mousemove', (e) => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
    }
    
    init() {
        this.resize();
        this.particles = [];
        for (let i = 0; i < this.numParticles; i++) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                radius: Math.random() * 40 + 20,
                color: this.colors[Math.floor(Math.random() * this.colors.length)],
                baseRadius: Math.random() * 40 + 20
            });
        }
    }
    
    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }
    
    animate() {
        // Draw dark background with trail effect
        this.ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            let p = this.particles[i];
            
            // Movement
            p.x += p.vx;
            p.y += p.vy;
            
            // Bounce off walls
            if (p.x - p.radius < 0 || p.x + p.radius > this.canvas.width) p.vx *= -1;
            if (p.y - p.radius < 0 || p.y + p.radius > this.canvas.height) p.vy *= -1;
            
            // Mouse interaction (repel/attract)
            let dx = this.mouse.x - p.x;
            let dy = this.mouse.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 200) {
                p.x -= dx * 0.02;
                p.y -= dy * 0.02;
                p.radius = p.baseRadius + (200 - dist) * 0.2;
            } else {
                p.radius = p.baseRadius;
            }
            
            // Draw metaball particle
            let gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            gradient.addColorStop(0, p.color);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = gradient;
            this.ctx.fill();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(this.animate);
    }
    
    // Trigger burst on success
    burst(x, y, color) {
        for(let i=0; i<20; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                radius: Math.random() * 60 + 30,
                color: color,
                baseRadius: 10,
                decay: true
            });
        }
        // Cleanup decay particles
        setTimeout(() => {
            this.particles = this.particles.filter(p => !p.decay);
        }, 1000);
    }
}


/**
 * ==========================================================================
 * AUDIO SYNTHESIS ENGINE
 * High-fidelity procedural audio & text-to-speech.
 * ==========================================================================
 */
class CyberAudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.synth = window.speechSynthesis;
        this.voice = null;
        this.initVoice();
    }
    
    initVoice() {
        let setupVoice = () => {
            let voices = this.synth.getVoices();
            // Prefer robotic or neutral English voices
            this.voice = voices.find(v => v.name.includes('Google UK English') || v.name.includes('Daniel') || v.name.includes('Samantha')) || voices[0];
        };
        setupVoice();
        this.synth.onvoiceschanged = setupVoice;
    }
    
    speakWord(text, rate = 1.0, pitch = 1.0) {
        if(this.synth.speaking) this.synth.cancel();
        let utter = new SpeechSynthesisUtterance(text);
        if(this.voice) utter.voice = this.voice;
        utter.rate = rate;
        utter.pitch = pitch;
        this.synth.speak(utter);
    }
    
    createOsc(freq, type, time, vol, sweepFreq = null) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(sweepFreq) {
            osc.frequency.exponentialRampToValueAtTime(sweepFreq, this.ctx.currentTime + time);
        }
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.start();
        osc.stop(this.ctx.currentTime + time);
    }
    
    playKeyStroke() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.createOsc(800 + Math.random()*400, 'sine', 0.05, 0.05);
    }
    
    playSuccess(comboLevel) {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        let baseFreq = 440 + (comboLevel * 20); // Pitch goes up with combo
        this.createOsc(baseFreq, 'sine', 0.2, 0.1);
        setTimeout(() => this.createOsc(baseFreq * 1.5, 'triangle', 0.3, 0.1), 100);
        setTimeout(() => this.createOsc(baseFreq * 2, 'square', 0.4, 0.05), 200);
    }
    
    playError() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.createOsc(200, 'sawtooth', 0.3, 0.2, 100);
        setTimeout(() => this.createOsc(150, 'square', 0.4, 0.2, 50), 100);
    }
    
    playLevelUp() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.createOsc(220, 'triangle', 1.5, 0.2, 880);
        setTimeout(() => this.createOsc(330, 'triangle', 1.5, 0.2, 1320), 200);
        setTimeout(() => this.createOsc(440, 'triangle', 1.5, 0.2, 1760), 400);
    }
}


/**
 * ==========================================================================
 * GAME CORE LOGIC (SpellingBeeEngine)
 * Manages DDA, UI updates, Input, and Level Progression.
 * ==========================================================================
 */
class SpellingBeeEngine {
    constructor() {
        this.level = 1;
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 20; // Reaches max multiplier at 20
        this.multiplier = 1.0;
        
        this.wordIndex = 0;
        this.wordsTyped = 0;
        this.charsTyped = 0;
        this.startTime = 0;
        
        this.currentWord = null;
        this.list = [];
        
        this.audio = new CyberAudioEngine();
        this.liquid = new LiquidCanvas();
        
        // Cache DOM
        this.uiScore = document.getElementById('ui-score');
        this.uiMult = document.getElementById('ui-mult');
        this.uiLvl = document.getElementById('level-display');
        this.uiDesc = document.getElementById('level-desc');
        this.uiComboFill = document.getElementById('combo-fill');
        
        this.uiInput = document.getElementById('console-input');
        this.uiFeedback = document.getElementById('visual-feedback');
        this.uiCtxDef = document.getElementById('context-def');
        this.uiCtxPhon = document.getElementById('context-phon');
        this.mainUI = document.getElementById('main-ui');
        
        this.uiWPM = document.getElementById('ui-wpm');
        this.uiAcc = document.getElementById('ui-acc');
        this.uiRem = document.getElementById('ui-rem');
        
        this.progressCircle = document.getElementById('lvl-progress-circle');
        this.progressText = document.getElementById('lvl-progress-text');
        
        this.bindEvents();
    }
    
    start() {
        this.startTime = Date.now();
        this.loadLevel(1);
        setInterval(() => this.updateDiagnostics(), 1000);
    }
    
    bindEvents() {
        this.uiInput.addEventListener('keydown', (e) => {
            if(e.key !== 'Enter') this.audio.playKeyStroke();
            if(e.key === 'Enter') this.validateInput();
        });
        
        document.getElementById('btn-play').addEventListener('click', () => {
            this.uiInput.focus();
            this.broadcastWord();
        });
        
        document.getElementById('btn-def').addEventListener('click', () => {
            this.uiInput.focus();
            this.uiCtxDef.textContent = `[DEFINITION]: ${this.currentWord.d}`;
            this.uiCtxPhon.textContent = `[PHONETIC]: /${this.currentWord.p}/`;
            // Read definition aloud with normal pitch/rate
            this.audio.speakWord(this.currentWord.d, 1.0, 1.0);
        });
        
        document.getElementById('btn-skip').addEventListener('click', () => {
            this.combo = 0; 
            this.updateStatsUI();
            this.triggerVisualFeedback(`OVERRIDDEN: ${this.currentWord.w}`, false);
            this.nextWord();
            this.uiInput.focus();
        });
    }
    
    loadLevel(l) {
        this.level = l;
        this.wordIndex = 0;
        this.list = FullLexicon[`lvl${l}`];
        
        // Update Theme
        document.body.className = `lvl-${l}`;
        this.uiLvl.textContent = `PHASE 0${l}`;
        this.uiLvl.setAttribute('data-text', `PHASE 0${l}`);
        
        const descArr = [
            "NEURAL BASELINE ESTABLISHED",
            "SYNAPTIC PATHWAYS ENHANCED",
            "COGNITIVE OVERCLOCK ACTIVE",
            "LINGUISTIC SINGULARITY IMMINENT",
            "TRANSCENDENTAL LEXICON REACHED"
        ];
        this.uiDesc.textContent = descArr[l-1];
        
        this.audio.playLevelUp();
        
        // Huge liquid burst on level up
        let rect = this.mainUI.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top + rect.height/2, '#ffffff');
        
        this.nextWord();
    }
    
    // Dynamic Difficulty Adjustment
    getDDA() {
        // Base rate increases with level. Extra speed added by combo streak.
        let rate = 0.8 + (this.level * 0.15) + (this.combo * 0.02);
        // Pitch drops slightly with higher levels to sound more ominous
        let pitch = 1.1 - (this.level * 0.1);
        
        return {
            rate: Math.min(rate, 2.0), // Cap rate
            pitch: Math.max(pitch, 0.5) // Floor pitch
        };
    }
    
    broadcastWord() {
        let params = this.getDDA();
        this.audio.speakWord(this.currentWord.w, params.rate, params.pitch);
    }
    
    nextWord() {
        if(this.wordIndex >= this.list.length) {
            if(this.level < 5) this.loadLevel(this.level + 1);
            else this.triggerVictory();
            return;
        }
        
        this.currentWord = this.list[this.wordIndex];
        this.uiInput.value = '';
        this.uiInput.disabled = false;
        this.uiInput.focus();
        
        // Reset context text
        this.uiCtxDef.textContent = `>> AWAITING INPUT STREAM... [ ${this.currentWord.w.length} CHARACTERS ]`;
        this.uiCtxPhon.textContent = "";
        
        this.updateDiagnosticsUI();
        
        // Small delay before broadcasting next word
        setTimeout(() => this.broadcastWord(), 400);
    }
    
    validateInput() {
        let inputVal = this.uiInput.value.trim().toLowerCase();
        if(inputVal === "") return;
        
        this.charsTyped += inputVal.length;
        
        if(inputVal === this.currentWord.w.toLowerCase()) {
            this.handleSuccess();
        } else {
            this.handleError();
        }
    }
    
    handleSuccess() {
        this.audio.playSuccess(this.combo);
        
        this.combo++;
        this.wordsTyped++;
        // Multiplier formula: Base 1.0 + (Combo * 0.1), maxing out based on maxCombo
        this.multiplier = 1.0 + (Math.min(this.combo, this.maxCombo) * 0.1);
        
        // Score calculation factoring level, length of word, and multiplier
        let basePoints = this.currentWord.w.length * 10;
        this.score += Math.floor(basePoints * this.multiplier * this.level);
        
        this.triggerVisualFeedback("LINK STABILIZED", true);
        
        // Particles
        let rect = this.uiInput.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top, '#39ff14');
        
        this.wordIndex++;
        this.updateStatsUI();
        this.nextWord();
    }
    
    handleError() {
        this.audio.playError();
        this.combo = 0;
        this.multiplier = 1.0;
        
        this.triggerVisualFeedback("SYSTEM CORRUPTION", false);
        
        // Particles
        let rect = this.uiInput.getBoundingClientRect();
        this.liquid.burst(rect.left + rect.width/2, rect.top, '#ff003c');
        
        this.uiInput.value = '';
        this.updateStatsUI();
    }
    
    triggerVisualFeedback(msg, isSuccess) {
        this.uiFeedback.textContent = msg;
        this.uiFeedback.className = isSuccess ? "msg-success" : "msg-error";
        
        // Reset animation state
        this.uiFeedback.style.opacity = '0';
        this.uiFeedback.style.transform = 'translateY(20px)';
        
        // Trigger reflow
        void this.uiFeedback.offsetWidth;
        
        // Apply animation
        this.uiFeedback.style.opacity = '1';
        this.uiFeedback.style.transform = 'translateY(0)';
        
        this.mainUI.classList.add(isSuccess ? 'success-state' : 'error-state');
        
        setTimeout(() => {
            this.uiFeedback.style.opacity = '0';
            this.uiFeedback.style.transform = 'translateY(-20px)';
            this.mainUI.classList.remove('success-state', 'error-state');
        }, 800);
    }
    
    updateStatsUI() {
        // Format score with leading zeros
        this.uiScore.textContent = this.score.toString().padStart(7, '0');
        this.uiMult.textContent = this.multiplier.toFixed(2) + 'x';
        
        // Update Combo Bar
        let comboPercent = Math.min((this.combo / this.maxCombo) * 100, 100);
        this.uiComboFill.style.width = `${comboPercent}%`;
        
        // Change combo color at max
        if(comboPercent === 100) {
            this.uiComboFill.style.boxShadow = "0 0 20px #fff, 0 0 40px #dd00f3";
        } else {
            this.uiComboFill.style.boxShadow = "0 0 10px rgba(255,255,255,0.5)";
        }
    }
    
    updateDiagnosticsUI() {
        this.uiRem.textContent = this.list.length - this.wordIndex;
        
        // Calculate progress circle
        let percent = (this.wordIndex / this.list.length) * 100;
        let offset = 176 - (176 * percent) / 100;
        this.progressCircle.style.strokeDashoffset = offset;
        this.progressText.textContent = Math.floor(percent) + '%';
    }
    
    updateDiagnostics() {
        if(this.startTime === 0) return;
        
        let minutes = (Date.now() - this.startTime) / 60000;
        if(minutes > 0) {
            let wpm = this.wordsTyped / minutes;
            this.uiWPM.textContent = wpm.toFixed(1);
        }
        
        // Approximation of accuracy based on attempts vs successes
        // Since combo drops to 0 on failure, we can track total errors if we added a counter.
        // For now, simple estimation based on words typed vs expected linear progression.
        let totalAttempts = this.wordsTyped + (this.wordIndex - this.wordsTyped); // Simplification
        if(this.wordIndex > 0) {
            let acc = (this.wordsTyped / Math.max(this.wordIndex, 1)) * 100;
            this.uiAcc.textContent = Math.min(acc, 100).toFixed(1) + '%';
        }
    }
    
    triggerVictory() {
        this.uiInput.disabled = true;
        this.uiInput.value = "DOMINANCE";
        this.uiCtxDef.innerHTML = "<span class='rainbow-text'>GLOBAL MAINFRAME OVERRIDDEN. ALL SECTORS SECURED.</span>";
        this.uiCtxPhon.textContent = "YOU ARE THE APEX LINGUIST.";
        this.audio.speakWord("System override complete. Global linguistic dominance achieved. Welcome, Administrator.", 0.8, 0.5);
        
        // Massive particle party
        setInterval(() => {
            this.liquid.burst(Math.random()*window.innerWidth, Math.random()*window.innerHeight, this.liquid.colors[Math.floor(Math.random()*this.liquid.colors.length)]);
        }, 200);
    }
}

/**
 * ==========================================================================
 * BOOT SEQUENCE LOGIC
 * Cinematic initialization and simulated loading.
 * ==========================================================================
 */
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('init-btn');
    const bootContainer = document.getElementById('boot-sequence');
    const appContainer = document.getElementById('app-container');
    const logs = document.getElementById('terminal-logs');
    
    const bootSequenceLines = [
        "KERNEL: Booting OS core...",
        "SYS: Allocating 1500 Lexicon parameters...",
        "SYS: Procedural generation [OK]",
        "NET: Establishing Neural Link Protocol v10...",
        "MEM: Flushing cached linguistic subroutines...",
        "AUDIO: Initializing TTS Synthesizer...",
        "VFX: Rendering liquid particle mesh...",
        "SEC: Bypassing firewall heuristics...",
        "CRIT: WARNING - Cognitive overload possible.",
        "SYS: Handshake complete. Standby for deployment."
    ];
    
    btn.addEventListener('click', () => {
        btn.style.transform = 'scale(0)';
        btn.style.opacity = '0';
        
        let delay = 0;
        bootSequenceLines.forEach((line, index) => {
            setTimeout(() => {
                let p = document.createElement('div');
                p.textContent = `> ${line}`;
                logs.appendChild(p);
                
                // Beep sound for typing effect
                let tempAudio = new (window.AudioContext || window.webkitAudioContext)();
                let osc = tempAudio.createOscillator();
                let gain = tempAudio.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800 + (Math.random()*200), tempAudio.currentTime);
                gain.gain.setValueAtTime(0.05, tempAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, tempAudio.currentTime + 0.05);
                osc.connect(gain); gain.connect(tempAudio.destination);
                osc.start(); osc.stop(tempAudio.currentTime + 0.05);
                
                if (index === bootSequenceLines.length - 1) {
                    setTimeout(() => {
                        bootContainer.style.opacity = '0';
                        setTimeout(() => {
                            bootContainer.style.display = 'none';
                            appContainer.style.display = 'grid';
                            
                            // Initialize Game Engine
                            window.GameInstance = new SpellingBeeEngine();
                            window.GameInstance.start();
                        }, 1500);
                    }, 1000);
                }
            }, delay);
            delay += 300 + Math.random() * 400; // Randomize loading pauses
        });
    });
});
