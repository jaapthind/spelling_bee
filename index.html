<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Spelling Bee Assessment</title>
<style>
    /* ==========================================================================
       CORE SYSTEM & RESET
       ========================================================================== */
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    body, html {
        width: 100%; 
        height: 100%; 
        background-color: #ffffff; 
        color: #000000;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        user-select: none;
    }

    /* ==========================================================================
       BOOT SEQUENCE
       ========================================================================== */
    #boot-sequence {
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%;
        background: #ffffff; 
        z-index: 10000; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        transition: opacity 1s ease;
    }

    #init-btn {
        padding: 15px 30px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        text-transform: uppercase;
        letter-spacing: 2px; 
        background: #ffffff;
        border: 2px solid #000000; 
        color: #000000;
        transition: all 0.2s; 
        z-index: 10;
        margin-bottom: 30px;
    }

    #init-btn:hover { 
        background: #000000; 
        color: #ffffff; 
    }

    #terminal-wrapper {
        width: 600px; 
        height: 150px;
        overflow: hidden;
    }

    #terminal-logs {
        color: #000000; 
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px; 
        line-height: 1.6;
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        height: 100%;
    }

    /* ==========================================================================
       MAIN APPLICATION LAYOUT
       ========================================================================== */
    #app-container {
        display: none; 
        flex-direction: column;
        height: 100vh; 
        width: 100vw; 
    }

    header {
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        padding: 20px 40px; 
        border-bottom: 2px solid #000000;
    }

    .header-controls {
        display: flex;
        gap: 15px;
    }

    .std-btn {
        background: #ffffff; 
        border: 2px solid #000000;
        color: #000000; 
        padding: 10px 20px; 
        font-size: 14px; 
        font-weight: bold;
        cursor: pointer; 
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: all 0.2s; 
    }

    .std-btn:hover { 
        background: #000000; 
        color: #ffffff; 
    }

    main { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        padding: 40px;
    }

    .dashboard {
        display: flex;
        gap: 50px;
        margin-bottom: 40px;
        text-align: center;
    }

    .stat-group {
        display: flex;
        flex-direction: column;
    }

    .stat-val {
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .stat-lbl {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555555;
        margin-top: 5px;
    }

    .input-zone { 
        position: relative; 
        width: 100%; 
        max-width: 800px;
        margin-bottom: 20px; 
    }
    
    #console-input {
        width: 100%; 
        background: transparent;
        border: none;
        border-bottom: 4px solid #000000;
        color: #000000; 
        font-size: 64px; 
        padding: 20px 10px; 
        text-align: center; 
        outline: none;
        font-family: 'Helvetica Neue', sans-serif; 
        letter-spacing: 10px; 
        font-weight: 300;
        text-transform: uppercase; 
        transition: all 0.3s;
    }

    #console-input:focus { 
        border-bottom-color: #555555; 
    }
    
    #console-input:disabled { 
        opacity: 0.3; 
        cursor: not-allowed; 
    }

    #visual-feedback { 
        height: 30px; 
        font-size: 18px; 
        letter-spacing: 2px; 
        font-weight: bold; 
        text-align: center; 
        opacity: 0; 
        transition: opacity 0.2s; 
        text-transform: uppercase;
    }

    .msg-success { color: #000000; }
    .msg-error { color: #000000; text-decoration: line-through; }

    #context-panel {
        margin-top: 40px; 
        font-size: 16px; 
        color: #555555;
        text-align: center;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    footer { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 20px 40px; 
        border-top: 2px solid #000000; 
    }

    .footer-section {
        display: flex;
        gap: 30px;
    }
</style>
</head>
<body>

<div id="boot-sequence">
    <button id="init-btn">INITIALIZE SYSTEM</button>
    <div id="terminal-wrapper">
        <div id="terminal-logs"></div>
    </div>
</div>

<div id="app-container">
    <header>
        <div class="header-controls">
            <button class="std-btn" id="btn-voice">VOICE: 1/10</button>
        </div>
        <div class="header-controls">
            <button class="std-btn" id="btn-play">RE-BROADCAST</button>
            <button class="std-btn" id="btn-skip">OVERRIDE</button>
        </div>
    </header>

    <main>
        <div class="dashboard">
            <div class="stat-group">
                <span class="stat-val" id="level-display">PHASE 01</span>
                <span class="stat-lbl" id="level-desc">INITIALIZING...</span>
            </div>
            <div class="stat-group">
                <span class="stat-val" id="ui-score">0000000</span>
                <span class="stat-lbl">TOTAL SCORE</span>
            </div>
            <div class="stat-group">
                <span class="stat-val" id="ui-mult">1.00x</span>
                <span class="stat-lbl">MULTIPLIER</span>
            </div>
            <div class="stat-group">
                <span class="stat-val" id="ui-combo">0</span>
                <span class="stat-lbl">COMBO</span>
            </div>
        </div>

        <div class="input-zone">
            <input type="text" id="console-input" autocomplete="off" spellcheck="false" placeholder="AWAITING AUDIO..." disabled>
        </div>
        
        <div id="visual-feedback"></div>
        
        <div id="context-panel">
            <div id="context-def">CONNECTING TO SECURE LEXICON...</div>
        </div>
    </main>

    <footer>
        <div class="footer-section">
            <div class="stat-group">
                <span class="stat-val" style="font-size: 20px;" id="ui-wpm">0.0</span>
                <span class="stat-lbl">WPM</span>
            </div>
            <div class="stat-group">
                <span class="stat-val" style="font-size: 20px;" id="ui-acc">100.0%</span>
                <span class="stat-lbl">PRECISION</span>
            </div>
        </div>
        <div class="footer-section">
            <div class="stat-group" style="align-items: center;">
                <span class="stat-val" style="font-size: 24px;" id="ui-rem">300</span>
                <span class="stat-lbl">WORDS REMAINING</span>
            </div>
        </div>
        <div class="footer-section">
            <div class="stat-group" style="align-items: flex-end;">
                <span class="stat-val" style="font-size: 20px;" id="lvl-progress-text">0%</span>
                <span class="stat-lbl">PROGRESSION</span>
            </div>
        </div>
    </footer>
</div>

// Ensure lists are exact to specifications (300 limit) and properly shuffled
for(let key in Lexicon) {
    if(Lexicon[key].length > 300) {
        Lexicon[key] = Lexicon[key].slice(0, 300);
    }
    for (let i = Lexicon[key].length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [Lexicon[key][i], Lexicon[key][j]] = [Lexicon[key][j], Lexicon[key][i]];
    }
}

/**
 * ==========================================================================
 * AUDIO ENGINE
 * ==========================================================================
 */
class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.synth = window.speechSynthesis;
        this.availableVoices = [];
        this.currentVoiceIndex = 0;
        
        this.btnVoice = document.getElementById('btn-voice');
        this.initVoices();
    }
    
    initVoices() {
        const populate = () => {
            let allVoices = this.synth.getVoices();
            let engVoices = allVoices.filter(v => v.lang.startsWith('en'));
            if(engVoices.length === 0) engVoices = allVoices; 
            
            this.availableVoices = engVoices.slice(0, 10);
            if(this.availableVoices.length > 0) {
                this.updateVoiceLabel();
            }
        };
        populate();
        this.synth.onvoiceschanged = populate;
        
        this.btnVoice.addEventListener('click', () => {
            if(this.availableVoices.length === 0) return;
            this.currentVoiceIndex = (this.currentVoiceIndex + 1) % this.availableVoices.length;
            this.updateVoiceLabel();
            this.createOsc(1000, 'sine', 0.1, 0.1);
        });
    }
    
    updateVoiceLabel() {
        let v = this.availableVoices[this.currentVoiceIndex];
        let shortName = v.name.split(' ')[0] || "VOICE";
        this.btnVoice.textContent = `VOICE: ${shortName.toUpperCase()} (${this.currentVoiceIndex + 1}/${this.availableVoices.length})`;
    }
    
    speakWord(text, rate = 1.0, pitch = 1.0) {
        if(this.synth.speaking) this.synth.cancel();
        let cleanText = text.replace(/[^a-zA-Z]/g, '');
        let utter = new SpeechSynthesisUtterance(cleanText);
        if(this.availableVoices.length > 0) {
            utter.voice = this.availableVoices[this.currentVoiceIndex];
        }
        utter.rate = rate;
        utter.pitch = pitch;
        this.synth.speak(utter);
    }
    
    createOsc(freq, type, time, vol, sweepFreq = null) {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(sweepFreq) osc.frequency.exponentialRampToValueAtTime(sweepFreq, this.ctx.currentTime + time);
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);
        
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + time);
    }
    
    playKeyStroke() { this.createOsc(800 + Math.random()*400, 'sine', 0.05, 0.05); }
    
    playSuccess(comboLevel) {
        let baseFreq = 440 + (comboLevel * 25); 
        this.createOsc(baseFreq, 'sine', 0.2, 0.1);
        setTimeout(() => this.createOsc(baseFreq * 1.5, 'triangle', 0.3, 0.1), 100);
    }
    
    playError() {
        this.createOsc(200, 'sawtooth', 0.3, 0.2, 100);
        setTimeout(() => this.createOsc(150, 'square', 0.4, 0.2, 50), 100);
    }
    
    playLevelUp() {
        this.createOsc(440, 'triangle', 0.5, 0.2, 880);
    }
}

/**
 * ==========================================================================
 * GAME CORE LOGIC
 * ==========================================================================
 */
class SpellingBeeEngine {
    constructor() {
        this.level = 1;
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 50;
        this.multiplier = 1.0;
        
        this.wordIndex = 0;
        this.wordsTyped = 0;
        this.startTime = 0;
        
        this.currentWord = "";
        this.list = [];
        
        this.audio = new AudioEngine();
        
        this.uiScore = document.getElementById('ui-score');
        this.uiMult = document.getElementById('ui-mult');
        this.uiCombo = document.getElementById('ui-combo');
        this.uiLvl = document.getElementById('level-display');
        this.uiDesc = document.getElementById('level-desc');
        
        this.uiInput = document.getElementById('console-input');
        this.uiFeedback = document.getElementById('visual-feedback');
        this.uiCtxDef = document.getElementById('context-def');
        
        this.uiWPM = document.getElementById('ui-wpm');
        this.uiAcc = document.getElementById('ui-acc');
        this.uiRem = document.getElementById('ui-rem');
        this.progressText = document.getElementById('lvl-progress-text');
        
        this.bindEvents();
    }
    
    start() {
        this.startTime = Date.now();
        this.loadLevel(1);
        setInterval(() => this.updateDiagnostics(), 1000);
    }
    
    bindEvents() {
        this.uiInput.addEventListener('keydown', (e) => {
            if(e.key !== 'Enter') this.audio.playKeyStroke();
            if(e.key === 'Enter') this.validateInput();
        });
        
        document.getElementById('btn-play').addEventListener('click', () => {
            this.uiInput.focus();
            this.broadcastWord();
        });
        
        document.getElementById('btn-skip').addEventListener('click', () => {
            this.combo = 0; 
            this.updateStatsUI();
            this.triggerVisualFeedback(`OVERRIDDEN: ${this.currentWord.toUpperCase()}`, false);
            this.nextWord();
            this.uiInput.focus();
        });
    }
    
    loadLevel(l) {
        this.level = l;
        this.wordIndex = 0;
        this.list = Lexicon[`lvl${l}`];
        
        this.uiLvl.textContent = `PHASE 0${l}`;
        const descArr = [
            "STANDARD LEXICON",
            "INTERMEDIATE LEXICON",
            "ADVANCED LEXICON",
            "EXPERT LEXICON",
            "MASTER LEXICON"
        ];
        this.uiDesc.textContent = descArr[l-1];
        this.audio.playLevelUp();
        this.nextWord();
    }
    
    getDDA() {
        let rate = 0.85 + (this.level * 0.1) + (this.combo * 0.015);
        let pitch = 1.0 - (this.level * 0.05);
        return { rate: Math.min(rate, 1.8), pitch: Math.max(pitch, 0.7) };
    }
    
    broadcastWord() {
        let params = this.getDDA();
        this.audio.speakWord(this.currentWord, params.rate, params.pitch);
    }
    
    nextWord() {
        if(this.wordIndex >= this.list.length) {
            if(this.level < 5) this.loadLevel(this.level + 1);
            else this.triggerVictory();
            return;
        }
        
        this.currentWord = this.list[this.wordIndex];
        this.uiInput.value = '';
        this.uiInput.disabled = false;
        this.uiInput.focus();
        
        this.uiCtxDef.textContent = `AWAITING AUDIO TRANSCRIPTION...`;
        this.updateDiagnosticsUI();
        setTimeout(() => this.broadcastWord(), 600);
    }
    
    validateInput() {
        let inputVal = this.uiInput.value.trim().toLowerCase();
        if(inputVal === "") return;
        
        if(inputVal === this.currentWord.toLowerCase()) {
            this.handleSuccess();
        } else {
            this.handleError();
        }
    }
    
    handleSuccess() {
        this.audio.playSuccess(this.combo);
        this.combo++;
        this.wordsTyped++;
        this.multiplier = 1.0 + (Math.min(this.combo, this.maxCombo) * 0.1);
        
        let basePoints = this.currentWord.length * 20;
        this.score += Math.floor(basePoints * this.multiplier * this.level);
        
        this.triggerVisualFeedback("CORRECT", true);
        this.wordIndex++;
        this.updateStatsUI();
        this.nextWord();
    }
    
    handleError() {
        this.audio.playError();
        this.combo = 0;
        this.multiplier = 1.0;
        this.triggerVisualFeedback("INCORRECT", false);
        this.uiInput.value = '';
        this.updateStatsUI();
    }
    
    triggerVisualFeedback(msg, isSuccess) {
        this.uiFeedback.textContent = msg;
        this.uiFeedback.className = isSuccess ? "msg-success" : "msg-error";
        
        this.uiFeedback.style.opacity = '0';
        void this.uiFeedback.offsetWidth;
        this.uiFeedback.style.opacity = '1';
        
        setTimeout(() => {
            this.uiFeedback.style.opacity = '0';
        }, 800);
    }
    
    updateStatsUI() {
        this.uiScore.textContent = this.score.toString().padStart(8, '0');
        this.uiMult.textContent = this.multiplier.toFixed(2) + 'x';
        this.uiCombo.textContent = this.combo;
    }
    
    updateDiagnosticsUI() {
        this.uiRem.textContent = this.list.length - this.wordIndex;
        let percent = (this.wordIndex / this.list.length) * 100;
        this.progressText.textContent = Math.floor(percent) + '%';
    }
    
    updateDiagnostics() {
        if(this.startTime === 0) return;
        let minutes = (Date.now() - this.startTime) / 60000;
        if(minutes > 0) {
            let wpm = this.wordsTyped / minutes;
            this.uiWPM.textContent = wpm.toFixed(1);
        }
        if(this.wordIndex > 0) {
            let acc = (this.wordsTyped / Math.max(this.wordIndex, 1)) * 100;
            this.uiAcc.textContent = Math.min(acc, 100).toFixed(1) + '%';
        }
    }
    
    triggerVictory() {
        this.uiInput.disabled = true;
        this.uiInput.value = "COMPLETE";
        this.uiCtxDef.textContent = "ALL ASSESSMENTS COMPLETED SUCCESSFULLY.";
        this.audio.speakWord("Assessment complete.", 1.0, 1.0);
    }
}

/**
 * ==========================================================================
 * BOOT SEQUENCE
 * ==========================================================================
 */
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('init-btn');
    const bootContainer = document.getElementById('boot-sequence');
    const appContainer = document.getElementById('app-container');
    const logs = document.getElementById('terminal-logs');
    
    const bootSequenceLines = [
        "Initializing core services...",
        "Loading lexicon...",
        "Secured 1500 terms.",
        "Establishing audio protocols...",
        "Ready."
    ];
    
    btn.addEventListener('click', () => {
        btn.style.display = 'none';
        
        let delay = 0;
        bootSequenceLines.forEach((line, index) => {
            setTimeout(() => {
                let p = document.createElement('div');
                p.textContent = `> ${line}`;
                logs.appendChild(p);
                
                if (index === bootSequenceLines.length - 1) {
                    setTimeout(() => {
                        bootContainer.style.opacity = '0';
                        setTimeout(() => {
                            bootContainer.style.display = 'none';
                            appContainer.style.display = 'flex';
                            window.GameInstance = new SpellingBeeEngine();
                            window.GameInstance.start();
                        }, 1000);
                    }, 500);
                }
            }, delay);
            delay += 200 + Math.random() * 200;
        });
    });
});
